name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q main.py system_info tests tools

      - name: Run application health check
        run: python main.py --check

      - name: Check installed packages
        run: python -m pip check

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Bandit
        run: python -m bandit -r system_info main.py -q

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --strict

      - name: Detect committed secrets
        shell: bash
        run: |
          python -m detect_secrets -c 1 scan --all-files \
            --exclude-files '(^|/)(\.git|\.venv|build|dist|\.pytest_cache|\.ruff_cache)/' \
            --exclude-files '^assets/' > detect-secrets-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("detect-secrets-report.json").read_text(encoding="utf-8"))
          results = report.get("results", {})
          if results:
              for filename, findings in sorted(results.items()):
                  print(f"{filename}: {len(findings)} possible secret(s)")
              raise SystemExit("Potential committed secrets detected")
          print("No committed secrets detected")
          PY
